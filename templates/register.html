{% extends "base.html" %}
{% block title %}Register · AI Text Detector{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h1 class="card-title">Create an account</h1>
        <p class="card-subtitle">Register to use the AI vs Human text classifier.</p>
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input class="form-input" id="username" name="username" type="text" required />
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input class="form-input" id="password" name="password" type="password" required />
            </div>

            <button type="submit" class="btn btn-primary btn-full" style="margin-top: 0.75rem;">
                Register
            </button>
        </form>

        <p class="text-muted" style="margin-top: 1rem;">
            Already have an account?
            <a class="text-link" href="{{ url_for('login') }}">Login instead</a>.
        </p>
    </div>
</div>
{% endblock %}
